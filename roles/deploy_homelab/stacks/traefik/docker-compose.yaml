services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6
    container_name: socket-proxy
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    userns_mode: host

  traefik:
    image: traefik:3.7.13
    container_name: traefik
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - 192.168.1.10:80:80
      - 192.168.1.10:443:443
      - 192.168.1.10:443:443/udp
    volumes:
      - /mnt/docker-volumes/traefik/data/acme:/acme
      - /mnt/docker-volumes/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - /mnt/docker-volumes/traefik/config/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    depends_on:
      - socket-proxy
    networks:
      default:
      proxy:
        aliases:
          - "auth.${DOMAIN}"

networks:
  proxy:
    external: true
