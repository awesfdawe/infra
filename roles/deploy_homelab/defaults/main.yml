---
# Base directory on the host where homelab services will be deployed (docker-compose and .env)
deploy_homelab_base_dir: /home/admin

# Base directory for container volumes and configurations
deploy_homelab_volumes_dir: /mnt/docker-volumes

# User and group that owns the service directories, compose and .env files
deploy_homelab_user: 1000
deploy_homelab_group: 1000

# Default file permissions for compose and .env
deploy_homelab_compose_mode: "0644"
deploy_homelab_env_mode: "0600"

# Default permissions and ownership for configuration files
deploy_homelab_default_mode: "0600"
deploy_homelab_default_uid: 100000
deploy_homelab_default_gid: 100000

# Default permissions and ownership for container volume directories
deploy_homelab_volumes_uid: 100000
deploy_homelab_volumes_gid: 100000
deploy_homelab_volumes_mode: "0755"

# External docker networks to ensure exist before deploying stacks
deploy_homelab_external_networks:
  - proxy
  - authelia

# Specific stacks to deploy. If empty, all stacks in roles/deploy_homelab/stacks/ are deployed.
deploy_homelab_stacks: []

# Optional overrides for stack configurations (state, enabled, etc.)
# Example:
# deploy_homelab_stack_overrides:
#   memos:
#     state: automated
deploy_homelab_stack_overrides:
  memos:
    state: stopped
