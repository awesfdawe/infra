---
- name: Bootstrap servers
  hosts: all

  pre_tasks:
    - name: Run OS validation
      ansible.builtin.include_tasks: tasks/validate_distro.yml

  tasks:
    - name: Run users configuration role
      ansible.builtin.include_role:
        name: users

    - name: Run bootstrap role
      ansible.builtin.include_role:
        name: bootstrap

    - name: Run ssh hardening role
      ansible.builtin.include_role:
        name: devsec.hardening.ssh_hardening
        apply:
          become: true

    - name: Run os hardening role
      ansible.builtin.include_role:
        name: devsec.hardening.os_hardening
        apply:
          become: true
      vars:
        sysctl_overwrite:
          net.ipv4.ip_forward: 1
        os_auditd_enabled: false
        os_user_pw_ageing: false
        os_auth_pw_max_age: 99999
        os_auth_pw_min_age: 0
